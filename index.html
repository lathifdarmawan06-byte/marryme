<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Proposal</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #ffecd2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #e91e63;
            font-size: 2.5em;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        #yes {
            background: #4caf50;
            color: white;
            transform: scale(1);
        }
        #no {
            background: #f44336;
            color: white;
        }
        .celebration {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .heart {
            font-size: 5em;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .message {
            font-size: 1.5em;
            color: #e91e63;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will You Be My Beautifull Wife?</h1>
        <div class="buttons">
            <button id="yes">Yes</button>
            <button id="no">No</button>
        </div>
    </div>
    <div class="celebration">
        <div class="heart">❤️</div>
        <div class="message">
            <p>Yay! I knew it!</p>
            <p>You have made me the happiest person in the world</p>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yes');
        const noBtn = document.getElementById('no');
        const container = document.querySelector('.container');
        const celebration = document.querySelector('.celebration');

        let yesScale = 1;

        // Function to move No button to a random position
        function moveNoButton() {
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            noBtn.style.position = 'absolute';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Function to increase Yes button size
        function growYesButton() {
            yesScale += 0.2;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        // Event listener for No button click
        noBtn.addEventListener('click', () => {
            moveNoButton();
            growYesButton();
        });

        // Event listener for No button hover (cursor approaching)
        noBtn.addEventListener('mouseenter', () => {
            moveNoButton();
            growYesButton();
        });

        // Event listener for Yes button click
        yesBtn.addEventListener('click', () => {
            container.style.display = 'none';
            celebration.style.display = 'block';
        });
    </script>
</body>
</html>
